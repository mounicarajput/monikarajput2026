<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Talks | Monika Rajput</title>
  <meta name="description" content="Talks by Monika Rajput on AI, data and cloud native, on a revolving globe and in a full list.">
  <meta name="theme-color" content="#faf8f4">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')==='dark'?'dark':'light'}catch(e){}</script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/parts.css">
  <link rel="stylesheet" href="css/globe.css">
  <noscript><style>.rv{opacity:1;transform:none}</style></noscript>
</head>
<body data-mode="world">
<div id="world">
  <aside class="panel"><h2>Regions</h2><ul id="regions"></ul><p id="regionNote"></p></aside>
  <div class="corner"><button class="btn" id="toList" type="button">Talk list</button><span>Drag to rotate. Esc for the list.</span></div>
  <div class="globe-box" id="globeBox"><canvas id="globe" aria-label="Globe of talk locations"></canvas><div id="overlay"></div><div class="tip" id="tip"></div></div>
</div>
<main id="list">
  <div class="wrap page-title"><h1>Sessions and talks</h1><p>Selected highlights from 60+ presentations on AI, data and cloud native, from conference stages to community meetups.</p></div>
  <div class="wrap">
    <div class="bar2"><span id="count"></span><div><button class="btn to-world" id="toWorld" type="button">World view</button><button class="btn" id="openSearch" type="button">Search</button></div></div>
    <div id="years"></div>
  </div>
</main>
<div class="search" id="search" role="dialog" aria-label="Search talks"><div>
  <input id="q" type="search" placeholder="Search talks, events, locations" autocomplete="off">
  <p><span id="results"></span><button class="chip" id="recorded" type="button" aria-pressed="false">with recording</button></p>
</div></div>
  <script type="module" src="js/speaking.js"></script>
</body>
</html>
