<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YC in 10 Seconds - Understand Y Combinator Companies Instantly</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      line-height: 1.6;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 40px 0 30px;
      border-bottom: 1px solid #f0f0f0;
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .header p {
      font-size: 14px;
      color: #666;
    }

    /* Search Bar */
    .search-container {
      margin-bottom: 30px;
    }

    #searchInput {
      width: 100%;
      padding: 14px 16px;
      font-size: 15px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    #searchInput:focus {
      border-color: #000;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
    }

    #searchInput::placeholder {
      color: #999;
    }

    /* Results Section */
    .results-container {
      display: none;
    }

    .results-container.active {
      display: block;
    }

    /* Company Cards */
    .company-card {
      padding: 16px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 12px;
      transition: all 0.2s ease;
      background: #f9f9f9;
    }

    .company-card:hover {
      border-color: #000;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .company-card h3 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .company-card .batch {
      font-size: 12px;
      color: #999;
    }

    /* Detail View */
    .detail-view {
      display: none;
      padding: 20px 0;
    }

    .detail-view.active {
      display: block;
    }

    .detail-header {
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #f0f0f0;
    }

    .detail-back {
      display: inline-block;
      font-size: 14px;
      color: #666;
      cursor: pointer;
      margin-bottom: 16px;
      transition: color 0.2s ease;
    }

    .detail-back:hover {
      color: #000;
    }

    .detail-header h2 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .detail-content {
      margin-bottom: 24px;
    }

    .detail-section {
      margin-bottom: 20px;
    }

    .detail-section-title {
      font-size: 13px;
      font-weight: 600;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      user-select: none;
    }

    .detail-section-title.collapsible {
      color: #000;
    }

    .detail-section-content {
      font-size: 15px;
      color: #333;
      line-height: 1.6;
    }

    .detail-section.collapsed .detail-section-content {
      display: none;
    }

    .collapse-icon {
      display: inline-block;
      width: 16px;
      height: 16px;
      transition: transform 0.2s ease;
    }

    .detail-section.collapsed .collapse-icon {
      transform: rotate(-90deg);
    }

    .reading-time {
      font-size: 13px;
      color: #999;
      padding-top: 16px;
      border-top: 1px solid #f0f0f0;
    }

    .loading {
      text-align: center;
      padding: 24px;
      color: #666;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #e0e0e0;
      border-top: 2px solid #000;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error {
      padding: 16px;
      background: #fff5f5;
      border: 1px solid #fecaca;
      border-radius: 8px;
      color: #c5192d;
      font-size: 14px;
      margin-top: 16px;
    }

    /* Waitlist CTA */
    .waitlist-cta {
      margin-top: 40px;
      padding: 20px;
      background: #f9f9f9;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #e0e0e0;
    }

    .waitlist-cta p {
      font-size: 14px;
      color: #666;
      margin-bottom: 12px;
    }

    .waitlist-btn {
      display: inline-block;
      padding: 10px 20px;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .waitlist-btn:hover {
      background: #333;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }

    .empty-state-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .empty-state p {
      font-size: 14px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .container {
        padding: 16px;
      }

      .header {
        padding: 24px 0 20px;
      }

      .header h1 {
        font-size: 22px;
      }

      .detail-header h2 {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>YC in 10 Seconds</h1>
      <p>Understand any Y Combinator company instantly</p>
    </div>

    <!-- Search View -->
    <div id="searchView" class="search-view">
      <div class="search-container">
        <input
          type="text"
          id="searchInput"
          placeholder="Search YC companies…"
          autocomplete="off"
        >
      </div>

      <div id="resultsContainer" class="results-container">
        <div id="resultsList"></div>
      </div>

      <div id="emptyState" class="empty-state">
        <div class="empty-state-icon">🚀</div>
        <p>Type a company name to get started</p>
      </div>
    </div>

    <!-- Detail View -->
    <div id="detailView" class="detail-view">
      <div class="detail-back" onclick="backToSearch()">← Back to search</div>

      <div class="detail-header">
        <h2 id="companyName"></h2>
      </div>

      <div class="detail-content">
        <!-- What it does (always expanded) -->
        <div class="detail-section">
          <div class="detail-section-title">What it does</div>
          <div class="detail-section-content" id="whatItDoes"></div>
        </div>

        <!-- Who it's for (collapsible) -->
        <div class="detail-section" id="whoItsForSection">
          <div class="detail-section-title collapsible" onclick="toggleSection(this)">
            <span class="collapse-icon">▶</span>
            Who it's for
          </div>
          <div class="detail-section-content" id="whoItsFor"></div>
        </div>

        <!-- Why it exists (collapsible) -->
        <div class="detail-section" id="whyItExistsSection">
          <div class="detail-section-title collapsible" onclick="toggleSection(this)">
            <span class="collapse-icon">▶</span>
            Why it exists
          </div>
          <div class="detail-section-content" id="whyItExists"></div>
        </div>

        <!-- Reading time -->
        <div class="reading-time" id="readingTime"></div>
      </div>

      <div class="waitlist-cta">
        <p>For more YC insights and updates, join the waitlist.</p>
        <a href="/waitlist-yc-monitor.html" class="waitlist-btn">Join Waitlist</a>
      </div>
    </div>
  </div>

  <script>
    // Data & State
    let companiesList = [];
    let explanationCache = {};
    const searchInput = document.getElementById('searchInput');
    const resultsList = document.getElementById('resultsList');
    const resultsContainer = document.getElementById('resultsContainer');
    const emptyState = document.getElementById('emptyState');
    const searchView = document.getElementById('searchView');
    const detailView = document.getElementById('detailView');

    // Load companies on init
    async function initApp() {
      try {
        const response = await fetch('/data/yc-companies.json');
        companiesList = await response.json();
        console.log(`✓ Loaded ${companiesList.length} YC companies`);
      } catch (error) {
        console.error('Failed to load companies:', error);
      }
    }

    // Search Handler
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.trim().toLowerCase();

      if (query.length === 0) {
        resultsContainer.classList.remove('active');
        emptyState.style.display = 'block';
        return;
      }

      const filtered = companiesList.filter(company =>
        company.name.toLowerCase().includes(query)
      );

      emptyState.style.display = 'none';
      resultsContainer.classList.add('active');

      if (filtered.length === 0) {
        resultsList.innerHTML = `<div class="empty-state"><p>No companies found</p></div>`;
        return;
      }

      resultsList.innerHTML = filtered.map(company => `
        <div class="company-card" onclick="selectCompany('${company.id}', '${company.name.replace(/'/g, "\\'")}')">
          <h3>${company.name}</h3>
          ${company.batch ? `<div class="batch">Batch: ${company.batch}</div>` : ''}
        </div>
      `).join('');
    });

    // Select Company
    async function selectCompany(companyId, companyName) {
      searchView.classList.remove('active');
      detailView.classList.add('active');

      document.getElementById('companyName').textContent = companyName;
      document.getElementById('whatItDoes').innerHTML = '<div class="loading"><div class="spinner"></div></div>';
      document.getElementById('whoItsFor').innerHTML = '';
      document.getElementById('whyItExists').innerHTML = '';
      document.getElementById('readingTime').innerHTML = '';

      // Check cache first
      if (explanationCache[companyId]) {
        displayExplanation(explanationCache[companyId]);
        return;
      }

      try {
        // Call API to generate explanation
        const response = await fetch('/api/yc-explain', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ company_name: companyName })
        });

        if (!response.ok) {
          throw new Error('Failed to generate explanation');
        }

        const explanation = await response.json();
        explanationCache[companyId] = explanation;
        displayExplanation(explanation);
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('whatItDoes').innerHTML = `
          <div class="error">Unable to generate explanation. Please try again.</div>
        `;
      }
    }

    // Display Explanation
    function displayExplanation(explanation) {
      document.getElementById('whatItDoes').textContent = explanation.what_it_does || '';
      document.getElementById('whoItsFor').textContent = explanation.who_its_for || '';
      document.getElementById('whyItExists').textContent = explanation.why_it_exists || '';
      document.getElementById('readingTime').textContent = explanation.reading_time || '';

      // Reset collapsible sections
      document.getElementById('whoItsForSection').classList.remove('collapsed');
      document.getElementById('whyItExistsSection').classList.remove('collapsed');
    }

    // Toggle Collapsible Section
    function toggleSection(element) {
      element.parentElement.classList.toggle('collapsed');
    }

    // Back to Search
    function backToSearch() {
      detailView.classList.remove('active');
      searchView.classList.add('active');
      searchInput.value = '';
      resultsContainer.classList.remove('active');
      emptyState.style.display = 'block';
      searchInput.focus();
    }

    // Initialize app
    initApp();
  </script>
</body>
</html>
